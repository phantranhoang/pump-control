<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Điều khiển 3 máy bơm</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      margin: 8px 0 14px;
      text-align: center;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
    }
    .dot.ok { background: #22c55e; }
    .dot.err { background: #ef4444; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pump-title {
      font-size: 18px;
      font-weight: 600;
    }
    .pump-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .badge-on { color: #4ade80; font-weight: 700; }
    .badge-off { color: #94a3b8; font-weight: 600; }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      min-width: 96px;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-turn-on { background: #22c55e; color: #052e16; }
    .btn-turn-off { background: #ef4444; color: #ffffff; }

    .btn-all-off {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: #334155;
      color: #f8fafc;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hệ thống 3 máy bơm</h1>

    <div class="status-bar">
      <div id="statusDot" class="dot"></div>
      <div id="statusText">Đang kết nối máy chủ MQTT...</div>
    </div>

    <div id="pumpList"></div>

    <button id="allOffBtn" class="btn-all-off" onclick="turnOffAll()" disabled>
      TẮT TẤT CẢ MÁY BƠM
    </button>
  </div>

  <script>
    // ====== 1. ĐIỀN USER VÀ PASS MQTT CỦA BẠN VÀO 2 DÒNG DƯỚI ======
    const WSS_URL   = "wss://r714f791.ala.asia-southeast1.emqxsl.com:8084/mqtt";
    const MQTT_USER = "USER_CUA_BAN";
    const MQTT_PASS = "PASS_CUA_BAN";

    // ====== 2. TOPIC ĐIỀU KHIỂN & TRẠNG THÁI 3 MÁY BƠM ======
    const PUMPS = [
      { id: 1, name: "Máy bơm 1", cmdTopic: "pump/1/cmd", stateTopic: "pump/1/state", state: "OFF" },
      { id: 2, name: "Máy bơm 2", cmdTopic: "pump/2/cmd", stateTopic: "pump/2/state", state: "OFF" },
      { id: 3, name: "Máy bơm 3", cmdTopic: "pump/3/cmd", stateTopic: "pump/3/state", state: "OFF" }
    ];

    let isConnected = false;

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const pumpListEl = document.getElementById("pumpList");
    const allOffBtn = document.getElementById("allOffBtn");

    function renderPumps() {
      pumpListEl.innerHTML = "";
      PUMPS.forEach((p) => {
        const isOn = p.state === "ON";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="pump-title">${p.name}</div>
            <div class="pump-sub">Trạng thái: <span class="${isOn ? "badge-on" : "badge-off"}">${isOn ? "ĐANG BẬT" : "ĐANG TẮT"}</span></div>
          </div>
          <button
            class="${isOn ? "btn-turn-off" : "btn-turn-on"}"
            ${isConnected ? "" : "disabled"}
            onclick="togglePump(${p.id})"
          >
            ${isOn ? "TẮT" : "BẬT"}
          </button>
        `;
        pumpListEl.appendChild(card);
      });
      allOffBtn.disabled = !isConnected;
    }

    function setStatus(state, text) {
      statusDot.className = "dot" + (state === "ok" ? " ok" : state === "err" ? " err" : "");
      statusText.textContent = text;
    }

    renderPumps();

    const clientId = "web_pump_" + Math.random().toString(16).slice(2, 10);
    const client = mqtt.connect(WSS_URL, {
      clientId,
      username: MQTT_USER,
      password: MQTT_PASS,
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 10000
    });

    client.on("connect", () => {
      isConnected = true;
      setStatus("ok", "Đã kết nối - Sẵn sàng điều khiển");
      renderPumps();
      PUMPS.forEach((p) => {
        client.subscribe(p.stateTopic, { qos: 1 });
      });
    });

    client.on("reconnect", () => {
      isConnected = false;
      setStatus("", "Đang kết nối lại máy chủ MQTT...");
      renderPumps();
    });

    client.on("error", (err) => {
      isConnected = false;
      setStatus("err", "Lỗi kết nối MQTT: " + (err && err.message ? err.message : "Không thể kết nối"));
      renderPumps();
    });

    client.on("close", () => {
      isConnected = false;
      renderPumps();
    });

    client.on("message", (topic, payload) => {
      const msg = payload.toString().trim().toUpperCase();
      const pump = PUMPS.find((p) => p.stateTopic === topic);
      if (pump && (msg === "ON" || msg === "OFF")) {
        pump.state = msg;
        renderPumps();
      }
    });

    function togglePump(id) {
      if (!isConnected) return;
      const pump = PUMPS.find((p) => p.id === id);
      if (!pump) return;
      const nextState = pump.state === "ON" ? "OFF" : "ON";
      client.publish(pump.cmdTopic, nextState, { qos: 1 });
      pump.state = nextState;
      renderPumps();
    }

    function turnOffAll() {
      if (!isConnected) return;
      PUMPS.forEach((p) => {
        client.publish(p.cmdTopic, "OFF", { qos: 1 });
        p.state = "OFF";
      });
      renderPumps();
    }
  </script>
</body>
</html>
