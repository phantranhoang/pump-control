<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bảng điều khiển 3 máy bơm</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #131c31;
      --bg-sub: #0f172a;
      --border: #24324d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #16233d 0%, var(--bg-main) 65%);
      color: var(--text-main);
      margin: 0;
      padding: 16px 14px 32px;
      min-height: 100vh;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 4px 0;
      letter-spacing: 0.3px;
      color: #ffffff;
    }

    .clock-text {
      font-size: 13px;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(19, 28, 49, 0.9);
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      flex-shrink: 0;
    }
    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .dot.err {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .esp-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .esp-badge.online {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.45);
    }

    .esp-badge.offline {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .pump-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .pump-card.is-on {
      border-color: rgba(34, 197, 94, 0.65);
      box-shadow: 0 8px 22px rgba(34, 197, 94, 0.12);
    }

    .pump-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pump-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .pump-img {
      width: 66px;
      height: 66px;
      object-fit: cover;
      border-radius: 12px;
      border: 1.5px solid #334155;
      background: #ffffff;
      flex-shrink: 0;
    }

    .pump-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .state-pill.on {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .state-pill.off {
      background: rgba(148, 163, 184, 0.12);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .volt-box {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .btn-power {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      min-width: 96px;
      flex-shrink: 0;
      letter-spacing: 0.4px;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn-power:active { transform: scale(0.97); }
    .btn-power:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-on {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #052e16;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .btn-off {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .timer-section {
      margin-top: 13px;
      background: var(--bg-sub);
      border-radius: 12px;
      padding: 11px 12px;
      border: 1px solid rgba(36, 50, 77, 0.8);
    }

    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .timer-status {
      color: #fbbf24;
      font-size: 12px;
      text-align: right;
    }

    .days-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .day-btn {
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      border-radius: 8px;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .day-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 9px;
    }

    .time-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .time-field label {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .time-field input[type="time"] {
      width: 100%;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .time-field input[type="time"]:focus {
      border-color: var(--accent-blue);
    }

    .timer-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save-timer {
      background: #0284c7;
      color: #ffffff;
    }

    .btn-clear-timer {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    .btn-all-off {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 14px;
      background: linear-gradient(135deg, #334155, #1e293b);
      color: #fca5a5;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .btn-all-off:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .note-box {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>HỆ THỐNG ĐIỀU KHIỂN 3 MÁY BƠM</h1>
      <div id="liveClock" class="clock-text">--:--:--</div>
    </div>

    <div class="status-bar">
      <div class="status-left">
        <div id="statusDot" class="dot"></div>
        <div id="statusText">Đang kết nối máy chủ MQTT...</div>
      </div>
      <div id="espBadge" class="esp-badge offline">ESP32: OFFLINE</div>
    </div>

    <div id="pumpList"></div>

    <button id="allOffBtn" class="btn-all-off" onclick="turnOffAll()" disabled>
      TẮT TẤT CẢ MÁY BƠM
    </button>

    <div class="note-box">
      Chọn ngày (T2–CN) và giờ Bật/Tắt rồi bấm <b>Lưu hẹn giờ</b>. Giữ trang web mở để tự động gửi lệnh đúng giờ.
    </div>
  </div>

  <script>
    const WSS_URL   = "wss://r714f791.ala.asia-southeast1.emqxsl.com:8084/mqtt";
    const MQTT_USER = "hoang";
    const MQTT_PASS = "0974266";
    const ESP_STATUS_TOPIC = "esp32/status";

    const DAY_OPTIONS = [
      { code: 1, label: "T2" },
      { code: 2, label: "T3" },
      { code: 3, label: "T4" },
      { code: 4, label: "T5" },
      { code: 5, label: "T6" },
      { code: 6, label: "T7" },
      { code: 0, label: "CN" }
    ];

    const PUMPS = [
      {
        id: 1,
        name: "Máy bơm 1",
        img: "./pump.jpg",
        cmdTopic: "pump/1/cmd",
        stateTopic: "pump/1/state",
        voltTopic: "pump/1/volt",
        state: "OFF",
        voltage: null,
        onTime: "",
        offTime: "",
        days: [1, 2, 3, 4, 5, 6, 0],
        lastTriggeredMinute: ""
      },
      {
        id: 2,
        name: "Máy bơm 2",
        img: "./pump.jpg",
        cmdTopic: "pump/2/cmd",
        stateTopic: "pump/2/state",
        voltTopic: "pump/2/volt",
        state: "OFF",
        voltage: null,
        onTime: "",
        offTime: "",
        days: [1, 2, 3, 4, 5, 6, 0],
        lastTriggeredMinute: ""
      },
      {
        id: 3,
        name: "Máy bơm 3",
        img: "./pump.jpg",
        cmdTopic: "pump/3/cmd",
        stateTopic: "pump/3/state",
        voltTopic: "pump/3/volt",
        state: "OFF",
        voltage: null,
        onTime: "",
        offTime: "",
        days: [1, 2, 3, 4, 5, 6, 0],
        lastTriggeredMinute: ""
      }
    ];

    let isConnected = false;
    let isEspOnline = false;
    let lastEspSeenMs = 0;

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const espBadge = document.getElementById("espBadge");
    const pumpListEl = document.getElementById("pumpList");
    const allOffBtn = document.getElementById("allOffBtn");
    const liveClockEl = document.getElementById("liveClock");

    function renderEspStatus() {
      if (!isConnected) {
        espBadge.className = "esp-badge offline";
        espBadge.textContent = "ESP32: CHƯA RÕ";
        return;
      }
      if (isEspOnline) {
        espBadge.className = "esp-badge online";
        espBadge.textContent = "● ESP32: ONLINE";
      } else {
        espBadge.className = "esp-badge offline";
        espBadge.textContent = "○ ESP32: OFFLINE";
      }
    }

    function loadSavedTimers() {
      try {
        const raw = localStorage.getItem("pump_timers_v2");
        if (!raw) return;
        const saved = JSON.parse(raw);
        PUMPS.forEach((p) => {
          if (saved[p.id]) {
            p.onTime = saved[p.id].onTime || "";
            p.offTime = saved[p.id].offTime || "";
            p.days = Array.isArray(saved[p.id].days) ? saved[p.id].days : [1, 2, 3, 4, 5, 6, 0];
          }
        });
      } catch (e) {}
    }

    function persistTimers() {
      const data = {};
      PUMPS.forEach((p) => {
        data[p.id] = { onTime: p.onTime, offTime: p.offTime, days: p.days };
      });
      localStorage.setItem("pump_timers_v2", JSON.stringify(data));
    }

    function formatDaysText(days) {
      if (!days || days.length === 0 || days.length === 7) return "Mỗi ngày";
      return DAY_OPTIONS.filter((d) => days.includes(d.code)).map((d) => d.label).join(", ");
    }

    function formatTimerSummary(p) {
      const timeParts = [];
      if (p.onTime) timeParts.push("Bật " + p.onTime);
      if (p.offTime) timeParts.push("Tắt " + p.offTime);
      if (!timeParts.length) return "Chưa đặt hẹn giờ";
      return `${formatDaysText(p.days)} • ${timeParts.join(" / ")}`;
    }

    function toggleDaySelection(pumpId, dayCode) {
      const pump = PUMPS.find((p) => p.id === pumpId);
      if (!pump) return;
      const idx = pump.days.indexOf(dayCode);
      if (idx >= 0) {
        pump.days.splice(idx, 1);
      } else {
        pump.days.push(dayCode);
      }
      renderPumps();
    }

    function renderPumps() {
      pumpListEl.innerHTML = "";
      PUMPS.forEach((p) => {
        const isOn = p.state === "ON";
        const voltText = (p.voltage !== null && p.voltage !== "") ? `${p.voltage} V` : "-- V";

        const daysHtml = DAY_OPTIONS.map((d) => {
          const active = p.days.includes(d.code);
          return `<button type="button" class="day-btn ${active ? "active" : ""}" onclick="toggleDaySelection(${p.id}, ${d.code})">${d.label}</button>`;
        }).join("");

        const card = document.createElement("div");
        card.className = "pump-card" + (isOn ? " is-on" : "");
        card.innerHTML = `
          <div class="pump-top">
            <div class="pump-info">
              <img src="${p.img}" alt="${p.name}" class="pump-img" />
              <div>
                <div class="pump-name">${p.name}</div>
                <div class="badges">
                  <span class="state-pill ${isOn ? "on" : "off"}">
                    ${isOn ? "● ĐANG BẬT" : "○ ĐANG TẮT"}
                  </span>
                  <span class="volt-box" id="volt-${p.id}">⚡ ${voltText}</span>
                </div>
              </div>
            </div>

            <button
              class="btn-power ${isOn ? "btn-off" : "btn-on"}"
              ${isConnected ? "" : "disabled"}
              onclick="togglePump(${p.id})"
            >
              ${isOn ? "TẮT" : "BẬT"}
            </button>
          </div>

          <div class="timer-section">
            <div class="timer-header">
              <span>Hẹn giờ theo ngày / tuần</span>
              <span class="timer-status" id="timer-label-${p.id}">${formatTimerSummary(p)}</span>
            </div>
            <div class="days-row">${daysHtml}</div>
            <div class="timer-grid">
              <div class="time-field">
                <label for="on-time-${p.id}">Giờ BẬT</label>
                <input type="time" id="on-time-${p.id}" value="${p.onTime}" />
              </div>
              <div class="time-field">
                <label for="off-time-${p.id}">Giờ TẮT</label>
                <input type="time" id="off-time-${p.id}" value="${p.offTime}" />
              </div>
            </div>
            <div class="timer-actions">
              <button class="btn-small btn-save-timer" onclick="saveTimer(${p.id})">Lưu hẹn giờ</button>
              <button class="btn-small btn-clear-timer" onclick="clearTimer(${p.id})">Xóa hẹn giờ</button>
            </div>
          </div>
        `;
        pumpListEl.appendChild(card);
      });

      allOffBtn.disabled = !isConnected;
    }

    function setStatus(state, text) {
      statusDot.className = "dot" + (state === "ok" ? " ok" : state === "err" ? " err" : "");
      statusText.textContent = text;
    }

    loadSavedTimers();
    renderPumps();
    renderEspStatus();

    const clientId = "web_pump_" + Math.random().toString(16).slice(2, 10);
    const client = mqtt.connect(WSS_URL, {
      clientId,
      username: MQTT_USER,
      password: MQTT_PASS,
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 10000
    });

    client.on("connect", () => {
      isConnected = true;
      setStatus("ok", "Đã kết nối • Sẵn sàng điều khiển");
      renderPumps();
      renderEspStatus();
      client.subscribe(ESP_STATUS_TOPIC, { qos: 1 });
      PUMPS.forEach((p) => {
        client.subscribe(p.stateTopic, { qos: 1 });
        client.subscribe(p.voltTopic, { qos: 0 });
      });
    });

    client.on("reconnect", () => {
      isConnected = false;
      setStatus("", "Đang kết nối lại máy chủ MQTT...");
      renderPumps();
      renderEspStatus();
    });

    client.on("error", (err) => {
      isConnected = false;
      setStatus("err", "Lỗi kết nối: " + (err && err.message ? err.message : "Không thể kết nối"));
      renderPumps();
      renderEspStatus();
    });

    client.on("close", () => {
      isConnected = false;
      renderPumps();
      renderEspStatus();
    });

    client.on("message", (topic, payload) => {
      const raw = payload.toString().trim();

      if (topic === ESP_STATUS_TOPIC) {
        const st = raw.toUpperCase();
        isEspOnline = (st === "ONLINE" || st === "1" || st === "TRUE");
        if (isEspOnline) {
          lastEspSeenMs = Date.now();
        }
        renderEspStatus();
        return;
      }

      const pumpState = PUMPS.find((p) => p.stateTopic === topic);
      if (pumpState) {
        const msg = raw.toUpperCase();
        if (msg === "ON" || msg === "OFF") {
          pumpState.state = msg;
          renderPumps();
        }
        return;
      }

      const pumpVolt = PUMPS.find((p) => p.voltTopic === topic);
      if (pumpVolt) {
        if (isConnected) {
          isEspOnline = true;
          lastEspSeenMs = Date.now();
          renderEspStatus();
        }
        const num = parseFloat(raw);
        pumpVolt.voltage = isNaN(num) ? raw : num.toFixed(1);
        const voltEl = document.getElementById(`volt-${pumpVolt.id}`);
        if (voltEl) {
          voltEl.textContent = `⚡ ${pumpVolt.voltage} V`;
        }
      }
    });

    function sendPumpCmd(id, cmd) {
      if (!isConnected) return;
      const pump = PUMPS.find((p) => p.id === id);
      if (!pump) return;
      client.publish(pump.cmdTopic, cmd, { qos: 1 });
      pump.state = cmd;
      renderPumps();
    }

    function togglePump(id) {
      const pump = PUMPS.find((p) => p.id === id);
      if (!pump) return;
      const nextState = pump.state === "ON" ? "OFF" : "ON";
      sendPumpCmd(id, nextState);
    }

    function turnOffAll() {
      if (!isConnected) return;
      PUMPS.forEach((p) => {
        client.publish(p.cmdTopic, "OFF", { qos: 1 });
        p.state = "OFF";
      });
      renderPumps();
    }

    function saveTimer(id) {
      const pump = PUMPS.find((p) => p.id === id);
      if (!pump) return;
      const onInput = document.getElementById(`on-time-${id}`);
      const offInput = document.getElementById(`off-time-${id}`);
      pump.onTime = onInput ? onInput.value : "";
      pump.offTime = offInput ? offInput.value : "";
      if (!pump.days || pump.days.length === 0) {
        pump.days = [1, 2, 3, 4, 5, 6, 0];
      }
      pump.lastTriggeredMinute = "";
      persistTimers();
      renderPumps();
    }

    function clearTimer(id) {
      const pump = PUMPS.find((p) => p.id === id);
      if (!pump) return;
      pump.onTime = "";
      pump.offTime = "";
      pump.days = [1, 2, 3, 4, 5, 6, 0];
      pump.lastTriggeredMinute = "";
      persistTimers();
      renderPumps();
    }

    function updateClockAndTimers() {
      const now = new Date();
      const dayNamesVi = ["Chủ nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
      const dayOfWeek = now.getDay();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      const currentHHMM = `${hh}:${mm}`;
      const minuteKey = `${now.toDateString()}_${currentHHMM}`;

      liveClockEl.textContent = `${dayNamesVi[dayOfWeek]} • ${hh}:${mm}:${ss}`;

      // Nếu đang báo ONLINE mà quá 35 giây không có dữ liệu/tin nhắn nào từ ESP32 thì báo OFFLINE
      if (isConnected && isEspOnline && lastEspSeenMs > 0 && (Date.now() - lastEspSeenMs > 35000)) {
        isEspOnline = false;
        renderEspStatus();
      }

      if (!isConnected) return;

      PUMPS.forEach((p) => {
        if (p.lastTriggeredMinute === minuteKey) return;
        const allowedToday = !p.days || p.days.length === 0 || p.days.includes(dayOfWeek);
        if (!allowedToday) return;

        if (p.onTime && p.onTime === currentHHMM) {
          p.lastTriggeredMinute = minuteKey;
          sendPumpCmd(p.id, "ON");
        } else if (p.offTime && p.offTime === currentHHMM) {
          p.lastTriggeredMinute = minuteKey;
          sendPumpCmd(p.id, "OFF");
        }
      });
    }

    setInterval(updateClockAndTimers, 1000);
    updateClockAndTimers();
  </script>
</body>
</html>
